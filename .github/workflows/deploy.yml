name: CI & Build CRM Captain Konveksi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Clean install dependencies
      run: npm ci

    - name: Run Automated Test Suite
      run: npm test

    - name: Run TypeScript Lint / Check
      run: npm run lint

    - name: Build Application (Vite Frontend & Server Backend)
      run: npm run build

